<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="skyCaptainPortraitTitle skyCaptainPortraitDesc">
  <title id="skyCaptainPortraitTitle">MarcusLab Portrait — The Sky Captain</title>
  <desc id="skyCaptainPortraitDesc">Original illustrated portrait of the Sky Captain — an anime-inspired adventurer with silver hair, aviation goggles, and an orange scarf.</desc>
  <defs>
