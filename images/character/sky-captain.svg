<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="skyCaptainTitle skyCaptainDesc">
  <title id="skyCaptainTitle">The Sky Captain</title>
  <desc id="skyCaptainDesc">An original anime-inspired adventurer with silver hair, aviation goggles, a navy coat and a flowing orange scarf.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9B8"/>
      <stop offset="0.55" stop-color="#F3C39C"/>
      <stop offset="1" stop-color="#DCA277"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A87F"/>
      <stop offset="1" stop-color="#C98D68"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#DCE7F3"/>
      <stop offset="0.7" stop-color="#A9BDD3"/>
      <stop offset="1" stop-color="#6E87A3"/>
    </linearGradient>
    <linearGradient id="hairShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA7BF"/>
      <stop offset="1" stop-color="#5A7592"/>
    </linearGradient>
    <linearGradient id="coat" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#223C5A"/>
      <stop offset="0.5" stop-color="#172B43"/>
      <stop offset="1" stop-color="#0D1A2A"/>
    </linearGradient>
    <linearGradient id="coatLight" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#34557A"/>
      <stop offset="1" stop-color="#172B43"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFA45F"/>
      <stop offset="0.4" stop-color="#FF791F"/>
      <stop offset="1" stop-color="#D95008"/>
    </linearGradient>
    <linearGradient id="scarfLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD0A8"/>
      <stop offset="0.5" stop-color="#FF9A4A"/>
      <stop offset="1" stop-color="#F26A11"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DC7FF"/>
      <stop offset="0.45" stop-color="#168BFF"/>
      <stop offset="0.75" stop-color="#FF791F"/>
      <stop offset="1" stop-color="#FFD0A8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="0.4" stop-color="#A9BDD3"/>
      <stop offset="1" stop-color="#73849A"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#C9D8E8"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#BFE2FF"/>
      <stop offset="0.4" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#0A4C91"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF791F" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#168BFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#168BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

